spring:
  application:
    name: pulse-example-oauth2-keycloak
  security:
    oauth2:
      client:
        registration:
          example:
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: client_credentials
        # provider.example.token-uri is injected at startup by TestcontainersConfiguration
        # from the Keycloak container's dynamic URL.

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health

pulse:
  check-timeout: 10s
  oauth2:
    enabled: true
    timeout: 5s
    probes: [readiness]
    providers:
      - name: example-idp
        registration-id: example
        # Default mode is `handshake` — performs a real client_credentials handshake
        # against the token endpoint on every probe, validating both that the IdP is
        # reachable AND that the registered credentials still work. Token is cached
        # and refreshed at 80% of min(token.expires_in, cache-ttl).
        cache-ttl: 1m

        # --- Alternative: reachable mode (opt-in, since Pulse 0.6.0) ---
        # Set `mode: reachable` to switch to a lighter probe that only GETs the OIDC
        # discovery document. No credentials are exercised, so a rotated secret won't
        # be caught here — useful when you have other monitoring that covers
        # credential breakage. The discovery URL is derived from the registration's
        # issuer-uri, or set explicitly via `discovery-uri` (escape hatch for
        # registrations that only configure token-uri).
        #
        # To try it against this example's Keycloak, you'd swap the token-uri
        # injection in TestcontainersConfiguration for an issuer-uri injection
        # (Spring Security then auto-discovers the rest), and add to the provider
        # block above:
        #
        #   mode: reachable
        #
        # The handshake/reachable trade-off table lives in the top-level README
        # under "OAuth2 check → Validation depth (mode)".
