spring:
  application:
    name: pulse-example-all-supported-checks

management:
  endpoint:
    health:
      show-details: always           # required to see Pulse's detail fields
  endpoints:
    web:
      exposure:
        include: health              # exposes /actuator/health + /liveness + /readiness

pulse:
  # Outer per-check deadline. Caps the total wall-clock time of any single check,
  # so a hung mount or stuck HTTP call can't block the whole /actuator/health response.
  check-timeout: 5s

  mount:
    enabled: true
    probes: [liveness, readiness]    # opt in to liveness — a missing critical mount
                                     # is a genuine reason to restart this pod.
    points:
      - name: tmp
        path: /tmp
        min-free-bytes: 1048576      # 1 MiB — adjust for your runtime
      - name: home
        path: ${user.home}
        min-free-percent: 5

  mule:
    enabled: true
    timeout: 2s
    probes: [readiness]              # downstream HTTP outage should only drop the pod
                                     # from the load balancer, not restart it.
    services:
      - name: httpbin-ok
        url: https://httpbin.org/status/200
        expected-status: 200
      - name: httpbin-flaky
        url: https://httpbin.org/status/503
        expected-status: 200         # mismatched: example shows how DOWN looks

# --- Optional: wire Pulse's `pulse.check` Observation into your observability stack ---
# Since Pulse 0.8.0 every check records a Micrometer Observation tagged with
# `name` (check key) and `kind` (mount / mule / oauth2 / custom / reactive).
# When no exporter is configured the Observation is a no-op (zero cost).
# Pick whichever stack your platform uses — no Pulse-side change required.
#
# ===== Prometheus =====
#
# 1. Add the registry dep to pom.xml:
#      <dependency>
#        <groupId>io.micrometer</groupId>
#        <artifactId>micrometer-registry-prometheus</artifactId>
#      </dependency>
#
# 2. Expose the Prometheus actuator endpoint:
#      management:
#        endpoints:
#          web:
#            exposure:
#              include: health, prometheus
#
# 3. Scrape /actuator/prometheus. Pulse's checks surface as:
#      pulse_check_seconds_count{kind="mount", name="tmp",         status="UP"}   142
#      pulse_check_seconds_sum  {kind="mount", name="tmp",         status="UP"}   0.118
#      pulse_check_seconds_count{kind="mule",  name="httpbin-ok",  status="UP"}   142
#      pulse_check_seconds_count{kind="mule",  name="httpbin-flaky",status="DOWN"} 142
#
# ===== OpenTelemetry / OTLP =====
#
# 1. Add the registries to pom.xml:
#      <dependency>
#        <groupId>io.micrometer</groupId>
#        <artifactId>micrometer-registry-otlp</artifactId>
#      </dependency>
#      <dependency>
#        <groupId>io.micrometer</groupId>
#        <artifactId>micrometer-tracing-bridge-otel</artifactId>
#      </dependency>
#
# 2. Point Spring Boot's OTLP exporter at your collector:
#      management:
#        otlp:
#          metrics:
#            export:
#              url: http://otel-collector.local:4318/v1/metrics
#          tracing:
#            endpoint: http://otel-collector.local:4318/v1/traces
#        tracing:
#          sampling:
#            probability: 1.0     # send every span; drop in real prod deployments
#
# Pulse's metrics + traces flow to the collector without any Pulse-side wiring.
#
# Trade-off table + transition-log format are in the top-level README under
# "Observability".
