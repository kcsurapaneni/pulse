name: Maven Package

# Publishes the artifact to Maven Central whenever a Release is created in the GitHub UI
# (or via `gh release create`). The workflow:
#   1. Checks out the tagged commit
#   2. Imports the GPG signing key from the GPG_PRIVATE_KEY secret
#   3. Builds + runs unit AND integration tests (./mvnw verify)
#   4. Deploys to Maven Central via the release profile, which:
#        - signs main/sources/javadoc jars with maven-gpg-plugin
#        - uploads via central-publishing-maven-plugin and waits until Central reports
#          the artefact is publicly resolvable
#
# Required GitHub secrets (configure under repo Settings > Secrets > Actions):
#   - CENTRAL_USERNAME / CENTRAL_PASSWORD: user token from https://central.sonatype.com
#   - GPG_PRIVATE_KEY:                     ASCII-armored private key
#                                          (`gpg --armor --export-secret-keys $KEY_ID`)
#   - GPG_PASSPHRASE:                      the key's passphrase

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central                 # matches <publishingServerId> in pom.xml release profile
          server-username: MAVEN_USERNAME    # name of env var the generated settings.xml reads
          server-password: MAVEN_PASSWORD    # ditto

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build and verify
        run: ./mvnw -B verify --file pom.xml

      - name: Publish to Maven Central
        run: ./mvnw -B deploy -Prelease -DskipTests --file pom.xml
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
