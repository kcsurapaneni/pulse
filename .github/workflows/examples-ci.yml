name: Examples CI

# Compiles every example project so silent drift (broken pom, removed API,
# stale version pin) is caught before it reaches a fresh cloner.
# The examples are intentionally NOT part of the parent build to keep the
# main verify path fast.

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/workflows/examples-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/workflows/examples-ci.yml'
  schedule:
    - cron: '0 6 * * 1'        # weekly Monday catch-all
  workflow_dispatch:

concurrency:
  group: examples-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        example:
          - 01-minimal-custom-check
          - 02-all-supported-checks
          - 03-webflux-reactive
          - 04-oauth2-keycloak

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: mvn -B compile
