name: CI

# Runs unit, slice, and integration tests on every push to main and every
# pull request targeting main. Catches regressions before release time —
# the maven-publish workflow only fires on release, which is too late.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # If a newer commit lands on the same ref while we're running, cancel the
  # in-flight job. Saves runner minutes; the newest commit is the one we care
  # about anyway.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, test, and verify
        run: ./mvnw -B verify --file pom.xml

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

      - name: Upload Failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports
          path: '**/target/failsafe-reports/'
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
